<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Orange Neon-Trennlinie</title>

<style>
    /* GRUNDEINSTELLUNGEN */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ORANGE NEON-TRENNLINIE */
    .orange-trennlinie {
        width: 100%;
        height: 2px;
        flex-shrink: 0;

        background: linear-gradient(
            90deg,
            #ff6a00 0%,
            #ffae36 20%,
            #ff7a00 40%,
            #ffd080 50%,
            #ff7900 60%,
            #ffae36 80%,
            #ff6a00 100%
        );

        /* ORANGER LEUCHTEFFEKT */
        box-shadow:
            0 0 4px #ff8000,
            0 0 9px rgba(255, 105, 0, 0.65),
            0 0 16px rgba(255, 105, 0, 0.25);

        animation:
            orangeGlow 3s ease-in-out infinite alternate;
    }

    /* SANFT PULSIERENDES NEONLICHT */
    @keyframes orangeGlow {
        from {
            opacity: 0.75;
            filter: brightness(0.85);
        }

        to {
            opacity: 1;
            filter: brightness(1.3);
        }
    }

    /* BARRIEREFREIHEIT */
    @media (prefers-reduced-motion: reduce) {
        .orange-trennlinie {
            animation: none;
        }
    }
</style>
</head>

<body>

<div class="orange-trennlinie"
     aria-hidden="true"></div>

</body>
</html>
